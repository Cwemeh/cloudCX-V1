name: Build and Deploy Plugins

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'check_providers.ps1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: 'main'

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: 'builds'
          path: 'builds'
        continue-on-error: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugins
        run: |
          cd main
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Prepare build artifacts
        run: |
          mkdir -p builds
          find main -name "*.cs3" -exec cp {} builds/ \;
          if [ -f main/build/plugins.json ]; then
            cp main/build/plugins.json builds/plugins.json
          fi
          if [ -f main/Website.json ]; then
            cp main/Website.json builds/Website.json
          fi
          cat << 'EOF' > builds/repo.json
          {
            "name": "cloudCX-V1",
            "description": "🇮🇩 Indonesian Movie & Anime Repository for CloudStream",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/Cwemeh/cloudCX-V1/builds/plugins.json"
            ]
          }
          EOF

      - name: Push to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./builds
